<h1>Daily Coding Practice</h1>

<section class="panel">
  <h2>
    <button
      type="button"
      id="panel-star-btn"
      aria-controls="panel-star"
      [attr.aria-expanded]="isOpen('star')"
      (click)="togglePanel('star')"
    >
      Star Demo
    </button>
  </h2>
  <div id="panel-star" role="region" aria-labelledby="panel-star-btn" [hidden]="!isOpen('star')">
    <app-star-demo />
  </div>
</section>

<section class="panel">
  <h2>
    <button
      type="button"
      id="panel-search-btn"
      aria-controls="panel-search"
      [attr.aria-expanded]="isOpen('search')"
      (click)="togglePanel('search')"
    >
      Search Page
    </button>
  </h2>
  <div
    id="panel-search"
    role="region"
    aria-labelledby="panel-search-btn"
    [hidden]="!isOpen('search')"
  >
    <app-search-page />
  </div>
</section>
