<div class="typeahead">
  <label [for]="inputId">Fruit</label>
  <input
    [id]="inputId"
    type="text"
    role="combobox"
    autocomplete="off"
    aria-autocomplete="list"
    [placeholder]="placeholder()"
    [value]="query()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="listboxId"
    [attr.aria-activedescendant]="activeIndex() >= 0 ? optionId(activeIndex()) : null"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
  />
  @if (isOpen()) {
    <ul [id]="listboxId" role="listbox" aria-label="Fruit suggestions">
      @if (isLoading()) {
        <li class="hint" aria-hidden="true">Loading...</li>
      } @else if (suggestions().length === 0) {
        <li class="hint" aria-hidden="true">No results found</li>
      } @else {
        @for (item of suggestions(); track item; let i = $index) {
          <li
            [id]="optionId(i)"
            role="option"
            [attr.aria-selected]="i === activeIndex()"
            [class.active]="i === activeIndex()"
            (click)="select(item)"
          >
            {{ item }}
          </li>
        }
      }
    </ul>
  }
  <div class="sr-only" role="status">
    {{ statusMessage() }}
  </div>
</div>
