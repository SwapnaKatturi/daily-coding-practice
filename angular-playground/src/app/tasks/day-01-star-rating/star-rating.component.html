<div class="stars" (mouseleave)="onMouseLeave()">
    @for (star of stars(); track star) {
        <span class="star"
            [class.filled] = 'star <= displayRating()'
            [class.readonly] = 'readOnly()'
            (click)='selectStar(star)'
            (mouseenter)='onMouseEnter(star)'>
            {{star <= displayRating()? '★':'☆'}}
        </span>
    }
</div>
